[package]
name        = "epica-runtime"
description = "BeliefRuntime: System 2 dual-process uncertainty, async update_belief, Trajectory-ECE, retrieval"
version.workspace    = true
edition.workspace    = true
rust-version.workspace = true
license.workspace    = true
authors.workspace    = true
repository.workspace = true
keywords.workspace   = true
categories.workspace = true

[features]
default = ["system2"]
# Enables the LLMClient trait + System 2 activation (requires network / async LLM calls)
system2 = ["dep:async-trait"]
# Enables continuous variational free-energy monitoring (Sprint 2). Opt-in:
# off by default keeps the hot path overhead-free and the dep graph minimal.
active-inference = ["dep:epica-active-inference"]

[dependencies]
epica-core.path        = "../epica-core"
epica-contracts.path   = "../epica-contracts"
epica-active-inference = { path = "../epica-active-inference", optional = true }
tokio          = { workspace = true, features = ["rt-multi-thread", "sync", "macros", "time"] }
serde.workspace        = true
serde_json.workspace   = true
thiserror.workspace    = true
tracing.workspace      = true
uuid.workspace         = true
governor.workspace     = true
async-trait            = { workspace = true, optional = true }

[dev-dependencies]
tokio    = { workspace = true, features = ["test-util", "rt-multi-thread", "macros"] }
proptest.workspace = true
uuid.workspace = true
serde_json.workspace = true

[[example]]
name = "multi_agent"
path = "../../examples/multi_agent.rs"

[[example]]
name = "long_horizon"
path = "../../examples/long_horizon.rs"
