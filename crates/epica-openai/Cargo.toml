[package]
name        = "epica-openai"
description = "OpenAiLlmClient: System 2 (UAR) via OpenAI Chat Completions API with forced function calling"
version.workspace    = true
edition.workspace    = true
rust-version.workspace = true
license.workspace    = true
authors.workspace    = true
repository.workspace = true
keywords.workspace   = true
categories.workspace = true

[features]
default = []

[dependencies]
epica-runtime = { path = "../epica-runtime", features = ["system2"] }
reqwest       = { workspace = true }
serde.workspace        = true
serde_json.workspace   = true
tokio          = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
async-trait.workspace  = true
thiserror.workspace    = true
tracing.workspace      = true

[dev-dependencies]
epica-core  = { path = "../epica-core" }
tokio       = { workspace = true, features = ["test-util", "rt-multi-thread", "macros"] }
wiremock    = { workspace = true }
uuid.workspace = true

[[example]]
name = "openai_provider"
path = "../../examples/openai_provider.rs"
